# Offline LLM + curated survival/medical reference corpus.
#
# Services:
#   - ollama:    model runtime (OpenAI-compatible API), pulls ${OLLAMA_MODEL}
#                on first start - internal only, not published to the host
#   - webui:     Open WebUI - chat frontend with built-in document/RAG
#                knowledge-base support (citations against uploaded docs) -
#                published on http://localhost:${LLM_WEBUI_PORT:-3001}/
#   - kiwix:     serves the WikiMed offline encyclopedia ZIM as a browsable
#                supplementary reference (not part of the RAG pipeline) -
#                published on http://localhost:${LLM_KIWIX_PORT:-3002}/
#
# Curated corpus (see corpus/sources.yaml + corpus/fetch.sh) is ingested
# into Open WebUI's knowledge base via ingest.sh - run that after fetch.sh
# and after webui has started at least once.

# Persistent data (ollama models, webui data, kiwix ZIM) lives under
# ${DATA_DIR:-./data} - DATA_DIR defaults to ./data next to this file,
# but can be set to an absolute path (e.g. an external drive mount) in
# this app's .env. See install.sh / README.md.

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama
    restart: unless-stopped
    # No GPU passthrough configured by default - add `deploy.resources` /
    # `devices` here if you have an NVIDIA GPU + nvidia-container-toolkit.

  ollama-pull:
    image: docker.io/ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama --host ollama:11434 list >/dev/null 2>&1; do sleep 2; done
        ollama --host ollama:11434 pull "${OLLAMA_MODEL:-llama3.2:3b}"
    restart: "no"

  webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
    volumes:
      - ${DATA_DIR:-./data}/webui:/app/backend/data
    ports:
      - "${LLM_WEBUI_PORT:-3001}:8080"
    restart: unless-stopped

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    command: ["--library", "/data/library.xml"]
    volumes:
      - ${DATA_DIR:-./data}/kiwix:/data
    ports:
      - "${LLM_KIWIX_PORT:-3002}:8080"
    restart: unless-stopped
