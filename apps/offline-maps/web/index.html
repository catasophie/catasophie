<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>catasophie - Offline Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script>
    // No reverse proxy in front - tiles is published directly on its
    // own host port (see docker-compose.yml / .env). config.js
    // (rendered from that port at container start, see
    // templates/config.js.template) tells us which.
    const cfg = window.MAPS_CONFIG || {};
    const tilesBase = `http://${location.hostname}:${cfg.tilesPort}`;

    const init = async () => {
      const styleRequest = await fetch(`${tilesBase}/styles/basic-preview/style.json`);
      const style = await styleRequest.json();
      const map = new maplibregl.Map({
        container: 'map',
        style,
        center: [0, 0],
        zoom: 2
      });

      map.addControl(new maplibregl.NavigationControl());

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            map.jumpTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 13 });
          },
          (err) => {
            console.warn('Geolocation unavailable:', err.message);
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    };

    init();
  </script>
</body>
</html>
