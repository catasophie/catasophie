<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>catasophie - Offline Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #region-picker {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      font: 13px/1.4 sans-serif;
      background: white;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      padding: 4px 6px;
      display: none;
    }
    #insecure-notice {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 1;
      font: 13px/1.4 sans-serif;
      background: #fff3cd;
      border: 1px solid #d4a72c;
      border-radius: 4px;
      padding: 8px 10px;
      display: none;
    }
    #insecure-notice a { font-weight: bold; }
  </style>
</head>
<body>
  <div id="map"></div>
  <select id="region-picker"></select>
  <div id="insecure-notice"></div>

  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script>
    // Same-origin relative paths - nginx (see templates/nginx.conf)
    // transparently reverse-proxies tileserver-gl's own paths
    // (/styles*, /data/*, /fonts/*, /sprites/*, /health) through to the
    // "tiles" service, so this works unchanged whether loaded via
    // http://localhost:3011/ or https://<device-ip>:3010/ - no separate
    // host:port to know about (unlike before - see git history), which
    // also avoids browsers blocking "mixed content" once this page is
    // loaded over HTTPS. config.js (rendered from MAPS_WEB_TLS_PORT at
    // container start, see templates/config.js.template) is only used
    // below to build the "switch to HTTPS" link.
    const cfg = window.MAPS_CONFIG || {};
    const picker = document.getElementById('region-picker');
    const insecureNotice = document.getElementById('insecure-notice');

    let map;

    const loadStyle = async (styleId) => {
      const styleRequest = await fetch(`styles/${styleId}/style.json`);
      const style = await styleRequest.json();

      if (map) {
        map.setStyle(style);
        return;
      }

      map = new maplibregl.Map({
        container: 'map',
        style,
        center: [0, 0],
        zoom: 2
      });
      map.addControl(new maplibregl.NavigationControl());

      // Shows the device's current location as a "you are here" dot
      // (with an accuracy circle, and a heading cone when the device
      // reports orientation), and adds a button to start/stop tracking
      // it. trackUserLocation makes this a toggle button (click once
      // to start watching the position live, click again to stop) -
      // it must NOT also be auto-triggered on load, since trigger()
      // toggles state: calling it automatically would leave the
      // control already "on" (WAITING_ACTIVE) by the time the user
      // sees it, so their first click would immediately turn it back
      // off instead of starting a fix - i.e. exactly a "button does
      // nothing" bug. So this is deliberately click-to-start, same as
      // any other MapLibre/Mapbox GL map with this control.
      const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
      });
      map.addControl(geolocate);

      // The Geolocation API (and therefore this button) only works on
      // a "secure context" - HTTPS, or "localhost" specifically. When
      // neither is true (e.g. loaded via plain http://<device-ip>/
      // from another device on the LAN), the browser silently refuses
      // to ever grant a position, which otherwise just looks like "the
      // button does nothing" - so tell the user directly instead,
      // with a link to the HTTPS port that does work (see
      // docker-compose.yml's MAPS_WEB_TLS_PORT / README.md).
      if (!window.isSecureContext) {
        const tlsPort = cfg.tlsPort || '3010';
        const httpsUrl = `https://${location.hostname}:${tlsPort}${location.pathname}`;
        insecureNotice.innerHTML =
          'The location marker needs HTTPS when accessed via LAN IP (browser security requirement). ' +
          `Open <a href="${httpsUrl}">${httpsUrl}</a> instead ` +
          '(you\'ll need to click through a one-time "not trusted" warning for the self-signed certificate).';
        insecureNotice.style.display = 'block';
      }
    };

    const init = async () => {
      // tileserver-gl registers one style per imported region (id =
      // region id, see scripts/lib.sh's regenerate_tiles_config) -
      // /styles.json lists them all so this viewer works whether one
      // or many regions have been imported (see scripts/add-region.sh
      // to import more after the initial install).
      const stylesRequest = await fetch('styles.json');
      const styles = await stylesRequest.json();

      if (!Array.isArray(styles) || styles.length === 0) {
        document.body.insertAdjacentHTML(
          'beforeend',
          '<p style="position:absolute;top:10px;left:10px;font:14px sans-serif;background:white;padding:8px;border-radius:4px;">No regions imported yet - run apps/offline-maps/scripts/import-region.sh</p>'
        );
        return;
      }

      styles.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
      for (const s of styles) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name || s.id;
        picker.appendChild(opt);
      }

      if (styles.length > 1) {
        picker.style.display = 'block';
      }
      picker.addEventListener('change', () => loadStyle(picker.value));

      await loadStyle(styles[0].id);
    };

    init();
  </script>
</body>
</html>
