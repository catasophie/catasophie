# Offline maps (tiles only - routing/geocoding disabled for now to
# keep the install slim; see git history for the osrm/geocoder setup).
#
# Services:
#   - tiles:      tileserver-gl serving a pre-built .mbtiles for the region -
#                 published on http://localhost:${MAPS_TILES_PORT:-3012}/
#   - web:        static MapLibre GL frontend (pans to your location),
#                 published on http://localhost:${MAPS_WEB_PORT:-3010}/ -
#                 calls the tiles service directly by port (see
#                 templates/config.js.template)
#
# Run scripts/import-region.sh once (with MAP_REGION set in .env) before
# starting these services - they expect data already present under
# ${DATA_DIR:-./data}/. DATA_DIR defaults to ./data next to this file,
# but can be set to an absolute path (e.g. an external drive mount) in
# this app's .env.

services:
  tiles:
    image: docker.io/maptiler/tileserver-gl:latest
    command: ["--config", "/data/config.json"]
    volumes:
      - ${DATA_DIR:-./data}/tiles:/data
    ports:
      - "${MAPS_TILES_PORT:-3012}:8080"
    restart: unless-stopped

  web:
    image: docker.io/library/nginx:1.27-alpine
    environment:
      # nginx's built-in docker-entrypoint.d/20-envsubst-on-templates.sh
      # renders templates/config.js.template (mounted below) into
      # config.js using these - no custom entrypoint script needed.
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
      - MAPS_TILES_PORT=${MAPS_TILES_PORT:-3012}
    volumes:
      - ./web:/usr/share/nginx/html
      - ./templates/config.js.template:/etc/nginx/templates/config.js.template:ro
    ports:
      - "${MAPS_WEB_PORT:-3010}:80"
    restart: unless-stopped
