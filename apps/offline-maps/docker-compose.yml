# Offline maps + basic navigation.
#
# Services:
#   - osrm:       routing engine (car profile), serves /route requests
#                 against a pre-built graph for ${MAP_REGION}
#   - tiles:      tileserver-gl serving a pre-built .mbtiles for the region
#   - geocoder:   Photon (offline address search) built from the same
#                 region extract
#   - web:        static MapLibre GL frontend (search + draw route)
#
# Run scripts/import-region.sh once (with MAP_REGION set in .env) before
# starting these services - they expect data already present under
# ./data/.

networks:
  catasophie:
    external: true

services:
  osrm:
    image: docker.io/osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./data/osrm:/data
    networks:
      - catasophie
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.maps-osrm.rule=PathPrefix(`/maps/route`)
      - traefik.http.services.maps-osrm.loadbalancer.server.port=5000
      - traefik.http.middlewares.maps-osrm-strip.stripprefix.prefixes=/maps/route
      - traefik.http.routers.maps-osrm.middlewares=maps-osrm-strip

  tiles:
    image: docker.io/maptiler/tileserver-gl:latest
    command: ["--config", "/data/config.json"]
    volumes:
      - ./data/tiles:/data
    networks:
      - catasophie
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.maps-tiles.rule=PathPrefix(`/maps/tiles`)
      - traefik.http.services.maps-tiles.loadbalancer.server.port=8080
      - traefik.http.middlewares.maps-tiles-strip.stripprefix.prefixes=/maps/tiles
      - traefik.http.routers.maps-tiles.middlewares=maps-tiles-strip

  geocoder:
    image: docker.io/rtuszik/photon-docker:latest
    volumes:
      - ./data/photon:/photon/data
    networks:
      - catasophie
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.maps-geocoder.rule=PathPrefix(`/maps/search`)
      - traefik.http.services.maps-geocoder.loadbalancer.server.port=2322
      - traefik.http.middlewares.maps-geocoder-strip.stripprefix.prefixes=/maps/search
      - traefik.http.routers.maps-geocoder.middlewares=maps-geocoder-strip

  web:
    image: docker.io/library/nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - catasophie
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.maps-web.rule=PathPrefix(`/maps/`)
      - traefik.http.routers.maps-web.priority=1
      - traefik.http.services.maps-web.loadbalancer.server.port=80
      - traefik.http.middlewares.maps-web-strip.stripprefix.prefixes=/maps
      - traefik.http.routers.maps-web.middlewares=maps-web-strip
