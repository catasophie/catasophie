# Static nginx config for the "web" service (mounted read-only over the
# image's default /etc/nginx/conf.d/default.conf - not templated/
# envsubst'd, since everything here is fixed regardless of which host
# ports docker-compose.yml maps 80/443 to).
#
# Two server blocks - plain HTTP (80) and self-signed HTTPS (443) -
# both serving the same static files AND transparently reverse-proxying
# tileserver-gl's own paths (/styles*, /data/*, /fonts/*, /sprites/*,
# /health) through to the "tiles" service (reachable by its compose
# service name on this app's own private network - see
# docs/ARCHITECTURE.md's "own private Podman network" note; this is
# NOT a shared/cross-app proxy, just this one app's own nginx routing
# to its own sibling container, same as any other single-app-with-
# multiple-services setup).
#
# Why proxy tiles through here at all, instead of the frontend calling
# the tiles service directly by its own published port (as before)?
# Two reasons, both about browser secure-context rules:
#   1. The Geolocation API (used for the "you are here" marker) is
#      blocked by browsers on any non-"localhost" origin served over
#      plain HTTP - LAN IP access needs HTTPS. Hence the 443 server
#      block + self-signed cert (see scripts/ensure-tls-cert.sh).
#   2. Once the page itself is loaded over HTTPS, it can no longer make
#      "mixed content" requests to a plain-HTTP endpoint on a different
#      port (browsers block this) - so the tiles backend has to be
#      reachable on the *same* origin/protocol as the page, not a
#      separate host:port. Proxying solves this for both the HTTP and
#      HTTPS server blocks at once, so the frontend just uses
#      same-origin relative paths (see web/index.html) regardless of
#      which port/protocol it was loaded from.
#
# tileserver-gl builds any absolute URLs it returns (e.g. inside
# style.json's "sources") from the incoming request's Host and
# X-Forwarded-Proto (it already has `app.enable('trust proxy')` - see
# its src/server.js) - forwarding those correctly (see
# templates/tiles-proxy.conf) is what keeps those generated URLs
# consistent with whichever origin/port the browser actually used.
#
# The tiles service's own port (MAPS_TILES_PORT, published directly in
# docker-compose.yml) is left as-is for non-browser consumers (e.g.
# ATAK raster tiles - see README.md) that don't care about any of the
# above.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /styles.json { include /etc/nginx/tiles-proxy.conf; }
    location /styles/ { include /etc/nginx/tiles-proxy.conf; }
    location /data/ { include /etc/nginx/tiles-proxy.conf; }
    location /fonts/ { include /etc/nginx/tiles-proxy.conf; }
    location /sprites/ { include /etc/nginx/tiles-proxy.conf; }
    location = /health { include /etc/nginx/tiles-proxy.conf; }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-signed - generated by scripts/ensure-tls-cert.sh (idempotent,
    # run by install.sh/up.sh). Browsers will show a one-time warning to
    # click through ("Advanced" -> "Proceed") since it's not from a
    # trusted CA - expected/fine for a LAN-only device with no public
    # DNS name. Geolocation and other secure-context features work
    # normally once accepted, regardless of the cert not being
    # CA-trusted (only the transport needs to be TLS).
    ssl_certificate     /etc/nginx/certs/web.crt;
    ssl_certificate_key /etc/nginx/certs/web.key;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /styles.json { include /etc/nginx/tiles-proxy.conf; }
    location /styles/ { include /etc/nginx/tiles-proxy.conf; }
    location /data/ { include /etc/nginx/tiles-proxy.conf; }
    location /fonts/ { include /etc/nginx/tiles-proxy.conf; }
    location /sprites/ { include /etc/nginx/tiles-proxy.conf; }
    location = /health { include /etc/nginx/tiles-proxy.conf; }
}
