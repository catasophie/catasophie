# Included inside each `location` block in nginx.conf that should be
# proxied through to the tiles service - kept as a single shared
# snippet so both the HTTP and HTTPS server blocks (and every proxied
# path) stay identical. See nginx.conf's top comment for why this
# proxying exists at all.
#
# Host is forwarded verbatim as $http_host (not the port-stripped
# $host) specifically so it still includes whatever port the browser
# actually used (e.g. "192.168.50.137:3011") - tileserver-gl parses the
# port straight out of the Host header it receives (see getUrlObject()
# in its src/utils.js) to build the absolute tile/style/sprite URLs it
# returns. Do NOT also send X-Forwarded-Port here: nginx's $server_port
# is the *container-internal* listen port (80/443), not the actual
# published host port (MAPS_WEB_PORT/MAPS_WEB_TLS_PORT), and
# tileserver-gl gives X-Forwarded-Port priority over whatever port was
# in the Host header - sending it would silently break every generated
# tile/data URL back to the wrong (443/80, i.e. default-and-omitted)
# port. Ask us how we know.
proxy_pass http://tiles:8080;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
