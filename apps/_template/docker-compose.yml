# Example service - replace with your actual service(s).
# Conventions (see docs/ADDING_AN_APP.md):
#   - publish your service directly on a host port (no reverse proxy) -
#     pick a sensible default and make it .env-overridable, e.g.
#     ${__PORT_VAR__:-__PORT__} (see install.sh)
#   - persistent data goes under ${DATA_DIR:-./data} (gitignored) so it
#     can optionally be redirected to an external drive via DATA_DIR in
#     this app's .env (see install.sh)

services:
  __APP_ID__:
    image: docker.io/hashicorp/http-echo:latest
    command: ["-text=replace me", "-listen=:__PORT__"]
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - "${__PORT_VAR__:-__PORT__}:__PORT__"
    restart: unless-stopped
