# Example tool service - replace with your actual service(s).
# Conventions:
#   - join the shared "catasophie" external network
#   - do not publish ports to the host, only the reverse proxy talks to you
#   - persistent data lives under ./data (gitignored)

services:
  _template:
    image: hashicorp/http-echo:latest
    command: ["-text=replace me", "-listen=:8000"]
    volumes:
      - ./data:/data
    networks:
      - catasophie
    restart: unless-stopped

networks:
  catasophie:
    external: true
