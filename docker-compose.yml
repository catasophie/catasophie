# Root compose file: only the shared network + reverse proxy + landing page.
#
# Apps live in apps/<name>/docker-compose.yml as fully independent compose
# projects. They are started/stopped separately (see scripts/up.sh) and are
# discovered automatically by Traefik via labels declared in their own
# compose files - no edits needed here when a new app is added.
#
# Run `podman network create catasophie` once (scripts/up.sh does this for
# you) before starting anything.

networks:
  catasophie:
    external: true

volumes:
  proxy-certs:

services:
  proxy:
    image: docker.io/library/traefik:v3.1
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      # Podman's Docker-compatible API socket, so Traefik can watch
      # containers (across all apps sharing the "catasophie" network) and
      # auto-configure routers from their labels.
      - ${PODMAN_SOCK:-/run/podman/podman.sock}:/var/run/docker.sock:ro
      - proxy-certs:/certs
    networks:
      - catasophie
    restart: unless-stopped

  landing:
    image: docker.io/library/nginx:1.27-alpine
    volumes:
      - ./proxy/landing:/usr/share/nginx/html:ro
    networks:
      - catasophie
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=PathPrefix(`/`)
      # No explicit priority - Traefik auto-prioritizes by rule
      # specificity, so this catch-all naturally loses to every app's
      # more specific PathPrefix (e.g. `/maps/`). Do NOT hardcode a
      # priority here - it defeats that and causes 404s (see
      # docs/ADDING_AN_APP.md).
      - traefik.http.services.landing.loadbalancer.server.port=80
