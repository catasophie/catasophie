# Authelia configuration - minimal file-based setup for a local/offline deployment.
# No external dependencies (no SMTP, no external DB) - everything is file-based
# so this works fully offline, matching the project's core requirement.
#
# NOTE: access_control below only encodes a coarse default policy (must be
# authenticated as at least "user" group). Fine-grained per-tool authorization
# (manifest `required_role`) is enforced by the dashboard app itself, which
# reads the Remote-Groups header Authelia/Caddy forward through.

theme: light

server:
  address: "tcp://:9091"

log:
  level: info

totp:
  issuer: catasophie

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: one_factor
  rules:
    - domain: "catasophie.local"
      policy: one_factor

session:
  name: catasophie_session
  same_site: lax
  expiration: 12h
  inactivity: 1h
  cookies:
    - domain: catasophie.local
      # NOTE: Authelia requires these URLs to use a secure (https) scheme
      # for session cookies to work correctly in browsers. This deployment
      # uses Caddy's "tls internal" self-signed cert (see core/proxy/Caddyfile)
      # so HTTPS works fully offline, without any public CA/ACME dependency.
      # Authelia is served on its own subdomain (see Caddyfile comments).
      authelia_url: "https://auth.catasophie.local"
      default_redirection_url: "https://catasophie.local/"

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notifications.txt
